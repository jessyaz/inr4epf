defaults:
  - /lstm_3008
  - override /hydra/sweeper: optuna
  - _self_

hydra:
  sweeper:
    sampler:
      seed: 42
    direction: minimize
    study_name: lstm_3008_sweep
    storage: sqlite:///optuna_studies/lstm_3008.db
    n_trials: 30
    n_jobs: 1
    params:
      model.lr: interval(0.0001, 0.01)
      model.hidden_dim: choice(32, 64, 128, 256, 512, 1024)
      model.teacher_forcing: interval(0.0, 1.0)
      dataset.batch_size: choice(16, 32, 64, 128)