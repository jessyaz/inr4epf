_target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
sampler:
  _target_: optuna.samplers.TPESampler
  seed: 42
direction: minimize
n_trials: 50
n_jobs: 1
params:
  model.deepsets.hidden_dim: choice(32, 64, 128, 256)
  model.deepsets.aggregation: choice(mean, max, sum)
  model.lr: tag(log, interval(1e-4, 1e-2))
  model.inr.hidden_dim: choice(32, 64, 128, 256)
  model.inr.num_layers: choice(2, 3, 4, 5)
  model.inr.film_hidden_dim: choice(64, 128, 256)