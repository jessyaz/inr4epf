hydra:
  job:
    chdir: false

registry: ???
run_dir : null

dataset:
  name: NP #FR et autres
  batch_size: 32
  missing_rate: 0.1

seed: 42
device: auto

model_uid: null

model:
  name: "epf-transformer"
  lr: 0.0001
  num_epoch : 100
  lookback: 336
  horizon: 24
  exog_dim: 2
  embedding_dim: 32
  num_heads: 8              # nb de têtes d'attention du TransformerEncoder
  dim_feedforward: 128      # dimension du feedforward interne des couches encoder + MLP final
  num_layers: 6             # nb de couches du TransformerEncoder
  normalize_first: false    # pre-norm (true) vs post-norm (false) dans TransformerEncoderLayer
  dropout: 0.2
  activation: "relu"        # "relu" ou autre (gelu) selon BaseDailyElectricTransformer

mlflow:
  experiment_name: icassp-dev
  run_name: null